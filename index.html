<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070b12" />
  <title>Digital Octopus | All digital product in cheap price</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .pt-safe { padding-top: max(env(safe-area-inset-top), 0.75rem); }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom) + 5.5rem, 6rem); }

    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 25%;
      height: 200%;
      background: linear-gradient(60deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0) 100%);
      transform: rotate(25deg);
      animation: shineSweep 4s infinite ease-in-out;
    }
    @keyframes shineSweep {
      0% { left: -60%; }
      25% { left: 140%; }
      100% { left: 140%; }
    }

    @keyframes cardBorderGlow {
      0%, 100% {
        border-color: rgba(99, 102, 241, 0.25);
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
      }
      50% {
        border-color: rgba(99, 102, 241, 0.6);
        box-shadow: 0 0 16px -2px rgba(99, 102, 241, 0.25);
      }
    }
    .card-shine-border {
      border: 1.5px solid rgba(99, 102, 241, 0.25);
      animation: cardBorderGlow 4s infinite ease-in-out;
    }

    .glow-primary { box-shadow: 0 4px 20px -2px rgba(99, 102, 241, 0.3); }
    .glow-support { box-shadow: 0 4px 24px -2px rgba(16, 185, 129, 0.4); }
    .glow-active { box-shadow: 0 2px 14px -1px rgba(99, 102, 241, 0.35); }

    .folder-unfold {
      transform-origin: bottom right;
      animation: folderUnfoldAnim 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes folderUnfoldAnim {
      0% { opacity: 0; transform: scale(0.6) rotateX(-25deg) translateY(25px); }
      100% { opacity: 1; transform: scale(1) rotateX(0deg) translateY(0); }
    }

    .carousel-track {
      display: flex;
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    *, *::before, *::after {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#070b12] dark:text-slate-100 min-h-screen antialiased select-none pb-safe">

  <!-- 1. LUXURY SPLASH SCREEN -->
  <div id="splash-screen" class="fixed inset-0 z-[999] bg-[#070b12] flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="relative flex items-center justify-center">
      <div id="splash-logo-container" class="w-20 h-20 rounded-3xl bg-indigo-600 flex items-center justify-center font-black text-3xl text-white shadow-2xl shadow-indigo-500/40 glow-primary overflow-hidden">
        <span id="splash-logo-text">R</span>
        <img id="splash-logo-img" src="" class="w-full h-full object-contain hidden" />
      </div>
      <div class="absolute -inset-2 rounded-3xl border border-indigo-500/30 animate-ping opacity-30 pointer-events-none"></div>
    </div>
    <h1 class="mt-5 text-sm font-extrabold tracking-[0.25em] text-white uppercase" id="splash-title">DIGITAL STORE</h1>
    <div class="mt-8 w-28 h-1 bg-slate-800 rounded-full overflow-hidden">
      <div class="h-full bg-indigo-500 rounded-full animate-pulse"></div>
    </div>
  </div>

  <!-- 2. TOAST STACK -->
  <div id="toast-root" class="fixed top-5 left-1/2 -translate-x-1/2 z-[900] flex flex-col gap-2 max-w-xs w-full pointer-events-none px-4"></div>

  <!-- 3. TOP APP BAR -->
  <header class="sticky top-0 z-30 pt-safe bg-white/80 dark:bg-[#070b12]/85 backdrop-blur-xl border-b border-slate-200/80 dark:border-slate-800/80 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div id="header-logo-container" class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-extrabold text-white text-xs shadow-md shadow-indigo-600/30 overflow-hidden">
          <span id="header-logo-text">R</span>
          <img id="header-logo-img" src="" class="w-full h-full object-contain hidden" />
        </div>
        <div>
          <span class="font-extrabold tracking-tight text-xs uppercase block text-slate-900 dark:text-white leading-none" id="header-site-title">DIGITAL STORE</span>
          <span class="text-[9px] font-semibold text-emerald-500 flex items-center gap-1 mt-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="txt-live-stock">সরাসরি স্টক</span>
          </span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 rounded-full px-3 py-1 shadow-inner">
          <span class="text-[9px] uppercase tracking-wider text-slate-400 font-bold" id="lbl-balance-nav">Wallet</span>
          <span id="ui-balance" class="text-xs font-mono font-bold text-emerald-600 dark:text-emerald-400">৳0.00</span>
        </div>
        <button id="btn-quick-deposit-top" class="p-1.5 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-600 dark:text-indigo-400 border border-indigo-600/20 rounded-full transition-transform active:scale-95" title="Add Funds">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 4. MAIN CONTAINER -->
  <main id="app-view" class="p-4 max-w-md mx-auto space-y-4"></main>

  <!-- 5. FLOATING HELP & SUPPORT BUTTON -->
  <div class="fixed bottom-20 right-4 z-40 flex flex-col items-end pointer-events-auto">
    <div id="support-folder" class="hidden folder-unfold mb-3 w-72 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-2xl backdrop-blur-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-emerald-500/15 border border-emerald-500/20 text-emerald-500 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </div>
          <div>
            <h4 class="text-xs font-bold text-slate-900 dark:text-white" data-i18n="support_title">হেল্প ও সাপোর্ট</h4>
            <span class="text-[9px] text-emerald-500 font-semibold flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span data-i18n="support_status">২৪/৭ একটিভ সাপোর্ট</span>
            </span>
          </div>
        </div>
        <button id="btn-close-support" class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-white">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="mt-3.5 space-y-2.5">
        <a id="link-whatsapp" href="#" target="_blank" class="w-full flex items-center justify-between p-2.5 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-xl transition-all group">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-emerald-500 text-white flex items-center justify-center shadow-sm">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
            </div>
            <div class="text-left">
              <div class="text-xs font-bold text-slate-900 dark:text-white">WhatsApp Chat</div>
              <div class="text-[10px] text-slate-400" data-i18n="support_wa_desc">সরাসরি কথা বলুন</div>
            </div>
          </div>
          <svg class="w-4 h-4 text-emerald-500 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
        </a>

        <a id="link-telegram" href="#" target="_blank" class="w-full flex items-center justify-between p-2.5 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/20 rounded-xl transition-all group">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-cyan-500 text-white flex items-center justify-center shadow-sm">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
            </div>
            <div class="text-left">
              <div class="text-xs font-bold text-slate-900 dark:text-white">Telegram Support</div>
              <div class="text-[10px] text-slate-400" data-i18n="support_tg_desc">চ্যানেল ও সাপোর্ট</div>
            </div>
          </div>
          <svg class="w-4 h-4 text-cyan-500 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
        </a>

        <a id="link-phone" href="#" class="w-full flex items-center justify-between p-2.5 bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/20 rounded-xl transition-all group">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            </div>
            <div class="text-left">
              <div class="text-xs font-bold text-slate-900 dark:text-white">Direct Phone Call</div>
              <div class="text-[10px] text-slate-400" data-i18n="support_call_desc">জরুরি হেল্পলাইন</div>
            </div>
          </div>
          <svg class="w-4 h-4 text-indigo-500 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>

    <button id="btn-support-trigger" class="btn-shine w-13 h-13 p-3.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full shadow-2xl glow-support transition-all active:scale-95 flex items-center justify-center">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
    </button>
  </div>

  <!-- 6. HIGHLY VISIBLE ACTIVE BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#070b12]/95 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 max-w-md mx-auto flex justify-around py-2 px-3">
    <button id="nav-home" class="flex flex-col items-center justify-center gap-0.5 py-1 px-3 rounded-2xl transition-all duration-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-[10px] font-bold tracking-tight" data-i18n="nav_home">হোম</span>
    </button>
    <button id="nav-store" class="flex flex-col items-center justify-center gap-0.5 py-1 px-3 rounded-2xl transition-all duration-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      <span class="text-[10px] font-bold tracking-tight" data-i18n="nav_store">স্টোর</span>
    </button>
    <button id="nav-orders" class="flex flex-col items-center justify-center gap-0.5 py-1 px-3 rounded-2xl transition-all duration-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      <span class="text-[10px] font-bold tracking-tight" data-i18n="nav_orders">অর্ডার</span>
    </button>
    <button id="nav-wallet" class="flex flex-col items-center justify-center gap-0.5 py-1 px-3 rounded-2xl transition-all duration-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
      <span class="text-[10px] font-bold tracking-tight" data-i18n="nav_wallet">ওয়ালেট</span>
    </button>
    <button id="nav-profile" class="flex flex-col items-center justify-center gap-0.5 py-1 px-3 rounded-2xl transition-all duration-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-[10px] font-bold tracking-tight" data-i18n="nav_profile">প্রোফাইল</span>
    </button>
  </nav>

  <!-- 7. PROFILE EDIT MODAL -->
  <div id="edit-profile-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-extrabold text-slate-900 dark:text-white" data-i18n="edit_profile_title">প্রোফাইল এডিট</h3>
        <button id="btn-close-edit-modal" class="text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div>
        <label class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 block mb-2" data-i18n="choose_avatar">পছন্দের অ্যাভাটার নির্বাচন করুন (১০টি)</label>
        <div id="avatar-selection-grid" class="grid grid-cols-5 gap-2"></div>
      </div>

      <div class="space-y-3 pt-2">
        <div>
          <label class="text-[10px] font-bold uppercase text-slate-400">পূর্ণ নাম</label>
          <input type="text" id="edit-name" placeholder="Full Name" class="w-full bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 dark:text-white outline-none focus:border-indigo-500 mt-1" />
        </div>
        <div>
          <label class="text-[10px] font-bold uppercase text-slate-400">মোবাইল নম্বর</label>
          <input type="tel" id="edit-phone" placeholder="017XXXXXXXX" class="w-full bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 dark:text-white font-mono outline-none focus:border-indigo-500 mt-1" />
        </div>
        <button id="btn-save-profile" class="btn-shine w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
          <span id="edit-save-spinner" class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin hidden"></span>
          <span id="edit-save-text" data-i18n="save_changes">পরিবর্তন সংরক্ষণ করুন</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 8. CUSTOMER AUTH MODAL -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-extrabold text-slate-900 dark:text-white" data-i18n="auth_header">কাস্টমার অ্যাকাউন্ট</h3>
        <button id="btn-close-auth" class="text-slate-400 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

    function formatExactTimestamp(isoString) {
      if (!isoString) return "N/A";
      const d = new Date(isoString);
      const datePart = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const timePart = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
      return `${datePart} • ${timePart}`;

    function notify(message, isError = false) {
      const root = document.getElementById('toast-root');
      const t = document.createElement('div');
      t.className = `p-3.5 rounded-2xl border text-xs font-bold shadow-2xl backdrop-blur-xl flex items-center gap-2.5 transition-all duration-300 transform translate-y-2 opacity-0 ${
        isError 
          ? 'bg-rose-950/90 border-rose-800/80 text-rose-200' 
          : 'bg-slate-900/90 border-emerald-500/40 text-emerald-300'
      }`;
      const iconSvg = isError 
        ? `<svg class="w-4 h-4 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>`
        : `<svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`;

      t.innerHTML = `${iconSvg} <span>${message}</span>`;

      const { data: prof } = await supabase.from('profiles').select('*').eq('id', state.user.id).maybeSingle();

      (txs || []).forEach(t => {

      state.customerStats = { totalSpent: spent, totalDeposited: dep, totalOrders: ordCount };

    // =========================================================================
    // PURE PRODUCT IMAGE INFINITE CAROUSEL (NO TEXT / FULL BLEED IMAGE)
    // =========================================================================
    function setupInfiniteCarousel() {
      const track = document.getElementById('featured-track');
      const dotsContainer = document.getElementById('carousel-dots');
      const items = state.featuredProducts;

      if (!track || items.length === 0) {
        document.getElementById('featured-carousel-wrapper')?.classList.add('hidden');
        return;
      }

      let renderItems = [...items];
      const isLoopable = items.length > 1;

      if (isLoopable) {
        renderItems = [items[items.length - 1], ...items, items[0]];
      }

      // শুধুমাত্র প্রোডাক্ট ছবি থাকবে (কোনো টেক্সট বা বাটন থাকবে না)
      track.innerHTML = renderItems.map(p => `
        <div data-id="${p.id}" class="featured-slide-item min-w-full shrink-0 h-52 sm:h-60 flex items-center justify-center cursor-pointer relative select-none overflow-hidden bg-slate-950">
          ${p.image_url 
            ? `<img src="${p.image_url}" alt="${p.name}" class="w-full h-full object-cover object-center pointer-events-none" />`
            : `<div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-900 text-slate-500">
                <svg class="w-12 h-12 text-indigo-500/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                <span class="text-[11px] font-bold text-slate-400 mt-2">${p.name}</span>
               </div>`
          }
          <!-- স্টাইলিশ ইন-স্টক ট্যাগ -->
          <span class="absolute top-3 right-3 px-2.5 py-0.5 rounded-full text-[9px] font-extrabold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 backdrop-blur-md">
            In Stock
          </span>
        </div>
      `).join('');

      if (dotsContainer && isLoopable) {
        dotsContainer.innerHTML = items.map((_, i) => `
          <span class="carousel-dot h-2 rounded-full transition-all duration-300 ${i === 0 ? 'bg-indigo-500 w-5' : 'bg-slate-600/80 w-2'}"></span>
        `).join('');
      }

      let currentIndex = isLoopable ? 1 : 0;
      let isTransitioning = false;

      function updateSlide(animate = true) {
        if (!track) return;
        track.style.transition = animate ? "transform 0.45s cubic-bezier(0.25, 1, 0.5, 1)" : "none";
        track.style.transform = `translateX(-${currentIndex * 100}%)`;

        if (dotsContainer && isLoopable) {
          const realIndex = (currentIndex - 1 + items.length) % items.length;
          const dots = dotsContainer.querySelectorAll('.carousel-dot');
          dots.forEach((d, idx) => {
            if (idx === realIndex) {
              d.className = "carousel-dot h-2 rounded-full transition-all duration-300 bg-indigo-500 w-5";
            } else {
              d.className = "carousel-dot h-2 rounded-full transition-all duration-300 bg-slate-600/80 w-2";
            }
          });
        }
      }

      updateSlide(false);

      function nextSlide() {
        if (!isLoopable || isTransitioning) return;
        isTransitioning = true;
        currentIndex++;
        updateSlide(true);
      }

      function prevSlide() {
        if (!isLoopable || isTransitioning) return;
        isTransitioning = true;
        currentIndex--;
        updateSlide(true);
      }

      track.addEventListener('transitionend', () => {
        isTransitioning = false;
        if (!isLoopable) return;

        if (currentIndex >= renderItems.length - 1) {
          currentIndex = 1;
          updateSlide(false);
        } else if (currentIndex <= 0) {
          currentIndex = renderItems.length - 2;
          updateSlide(false);
        }
      });

      if (isLoopable) {
        state.carouselTimer = setInterval(nextSlide, 3500);
      }

      let startX = 0;
      let deltaX = 0;

      track.addEventListener('touchstart', (e) => {
        if (state.carouselTimer) clearInterval(state.carouselTimer);
        startX = e.touches[0].clientX;
        deltaX = 0;
      }, { passive: true });

      track.addEventListener('touchmove', (e) => {
        deltaX = e.touches[0].clientX - startX;
      }, { passive: true });

      track.addEventListener('touchend', () => {
        if (Math.abs(deltaX) > 40) {
          if (deltaX < 0) nextSlide();
          else prevSlide();
        }
        if (isLoopable) {
          state.carouselTimer = setInterval(nextSlide, 3500);
        }
      });

      track.querySelectorAll('.featured-slide-item').forEach(item => {
        item.addEventListener('click', () => {
          const product = state.products.find(x => x.id === item.dataset.id);
          if (product) navigate('product-details', product);
        });
      });
    }

      if (!state.user) { openAuthModal(); return; }
      if (state.isPurchasing) return;

      const customInput = document.getElementById('details-custom-input').value.trim();
      if (!customInput) { notify(i18n[state.lang].require_input, true); return; }

      const p = state.selectedProduct;
      if (state.balance < parseFloat(p.selling_price)) {
        notify(i18n[state.lang].insufficient_balance, true);
        return;
      }

      state.isPurchasing = true;
      const btn = document.getElementById('btn-details-purchase');
      const spinner = document.getElementById('details-buy-spinner');
      const text = document.getElementById('details-buy-text');

      btn.disabled = true;
      spinner.classList.remove('hidden');
      text.innerText = i18n[state.lang].processing;

      try {
        const idempotencyKey = generateUUID();

        const { data: orderId, error: orderErr } = await supabase.rpc('place_order_atomic', {
          p_product_id: p.id,
          p_quantity: 1,
          p_customer_input: { target: customInput },
          p_idempotency_key: idempotencyKey
        });

        if (orderErr) throw orderErr;

        notify(state.lang === 'bn' ? 'সাপ্লায়ার স্টকে পাঠানো হচ্ছে...' : 'Submitting to supplier stock...');

        const { data: edgeRes, error: edgeErr } = await supabase.functions.invoke('order-reseller-process', {
          body: { order_id: orderId }
        });

        if (edgeErr || !edgeRes.success) {
          notify(edgeRes?.message || 'Error occurred', true);
        } else {
          notify(i18n[state.lang].order_success);
        }

        await refreshBalanceAndProfile();
        navigate('orders');
      } catch (err) {
        notify(err.message || 'Transaction failed', true);
      } finally {
        state.isPurchasing = false;
        btn.disabled = false;
        spinner.classList.add('hidden');
        text.innerText = `${i18n[state.lang].pay_and_buy} (৳${parseFloat(p.selling_price).toFixed(2)})`;
      }
    }

    async function handleDepositExecution() {
      if (!state.user) { openAuthModal(); return; }
      if (state.isDepositing) return;

      const amtInput = document.getElementById('deposit-amt-input');
      const amount = parseFloat(amtInput?.value || 0);

      if (isNaN(amount) || amount < 10) {
        notify(i18n[state.lang].deposit_min, true);
        return;
      }

      state.isDepositing = true;
      const btn = document.getElementById('btn-exec-deposit');
      const spinner = document.getElementById('deposit-spinner');
      const btnText = document.getElementById('deposit-text');

      btn.disabled = true;
      spinner?.classList.remove('hidden');
      if (btnText) btnText.innerText = state.lang === 'bn' ? 'অপেক্ষা করুন...' : 'Processing...';

      try {
        const { data, error } = await supabase.functions.invoke('zinipay-handler', {
          body: { 
            amount,
            return_url: window.location.origin + window.location.pathname
          }
        });

        if (error) {
          let detail = error.message;
          try {
            const errBody = await error.context?.json();
            if (errBody && errBody.error) detail = errBody.error;
          } catch (_) {}
          throw new Error(detail);
        }

        if (!data?.payment_url) throw new Error("পেমেন্ট লিংক তৈরি করা যায়নি");
        window.location.href = data.payment_url;
      } catch (err) {
        notify(err.message, true);
      } finally {
        state.isDepositing = false;
        btn.disabled = false;
        spinner?.classList.add('hidden');
        if (btnText) btnText.innerText = i18n[state.lang].quick_deposit;
      }
    }

              </div>
              <div class="flex items-center bg-slate-100 dark:bg-slate-950 p-1 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs font-bold">
                <button id="btn-policy-bn" class="px-3 py-1 rounded-xl transition-all ${isBnPolicy ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">
                  বাংলা
                </button>
                <button id="btn-policy-en" class="px-3 py-1 rounded-xl transition-all ${!isBnPolicy ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}">
                  English
                </button>
              </div>
            </div>

            <div class="flex bg-slate-100 dark:bg-slate-950 p-1 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs font-bold">
              <button id="tab-policy-privacy" class="flex-1 py-2 rounded-xl transition-all flex items-center justify-center gap-1.5 ${
                state.activePolicyTab === 'privacy' 
                  ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                  : 'text-slate-400 hover:text-white'
              }">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                <span>${cur.tab_privacy}</span>
              </button>
              <button id="tab-policy-refund" class="flex-1 py-2 rounded-xl transition-all flex items-center justify-center gap-1.5 ${
                state.activePolicyTab === 'refund' 
                  ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' 
                  : 'text-slate-400 hover:text-white'
              }">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                <span>${cur.tab_refund}</span>
              </button>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl shadow-sm text-xs text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-line space-y-4">
            ${content}
          </div>
        </div>
      `;

      document.getElementById('btn-back-to-profile')?.addEventListener('click', () => navigate('profile'));

      document.getElementById('btn-policy-bn')?.addEventListener('click', () => {
        state.policyLang = 'bn';
        localStorage.setItem('reseller_policy_lang', 'bn');
        renderPolicies(el);
      });

      document.getElementById('btn-policy-en')?.addEventListener('click', () => {
        state.policyLang = 'en';
        localStorage.setItem('reseller_policy_lang', 'en');
        renderPolicies(el);
      });

      document.getElementById('tab-policy-privacy')?.addEventListener('click', () => {
        state.activePolicyTab = 'privacy';
        renderPolicies(el);
      });

      document.getElementById('tab-policy-refund')?.addEventListener('click', () => {
        state.activePolicyTab = 'refund';
        renderPolicies(el);
      });
    }

    // PROFILE EDIT
    function openEditProfileModal() {
      const prof = state.profile || {};
      const fullName = prof.full_name || (state.user ? state.user.user_metadata?.full_name : '') || '';
      const phoneNum = prof.phone || (state.user ? state.user.user_metadata?.phone : '') || '';

      document.getElementById('edit-name').value = fullName;
      document.getElementById('edit-phone').value = phoneNum;

      const grid = document.getElementById('avatar-selection-grid');
      grid.innerHTML = DEFAULT_AVATARS.map((url, idx) => `
        <div data-url="${url}" class="avatar-option cursor-pointer w-12 h-12 rounded-full overflow-hidden border-2 transition-all ${
          (state.selectedAvatarUrl === url || (!state.selectedAvatarUrl && idx === 0))
            ? 'border-indigo-600 ring-2 ring-indigo-600/40 scale-105' 
            : 'border-transparent hover:border-slate-400'
        }">
          <img src="${url}" alt="Avatar ${idx+1}" class="w-full h-full object-cover" />
        </div>
      `).join('');

      grid.querySelectorAll('.avatar-option').forEach(opt => {
        opt.addEventListener('click', () => {
          state.selectedAvatarUrl = opt.dataset.url;
          grid.querySelectorAll('.avatar-option').forEach(o => {
            o.className = "avatar-option cursor-pointer w-12 h-12 rounded-full overflow-hidden border-2 border-transparent hover:border-slate-400 transition-all";
          });
          opt.className = "avatar-option cursor-pointer w-12 h-12 rounded-full overflow-hidden border-2 border-indigo-600 ring-2 ring-indigo-600/40 scale-105 transition-all";
        });
      });

      document.getElementById('edit-profile-modal').classList.remove('hidden');
    }

    document.getElementById('btn-close-edit-modal')?.addEventListener('click', () => {
      document.getElementById('edit-profile-modal').classList.add('hidden');
    });

    document.getElementById('btn-save-profile')?.addEventListener('click', async () => {
      if (!state.user || state.isSavingProfile) return;
      const name = document.getElementById('edit-name').value.trim();
      const phone = document.getElementById('edit-phone').value.trim();

      state.isSavingProfile = true;
      const btn = document.getElementById('btn-save-profile');
      const spinner = document.getElementById('edit-save-spinner');
      const btnText = document.getElementById('edit-save-text');

      btn.disabled = true;
      spinner.classList.remove('hidden');
      btnText.innerText = "Saving...";

      try {
        const { error } = await supabase.from('profiles').update({
          full_name: name,
          phone: phone,
          avatar_url: state.selectedAvatarUrl,
          updated_at: new Date().toISOString()
        }).eq('id', state.user.id);

        if (error) throw error;

        notify("প্রোফাইল সংরক্ষিত হয়েছে!", false);
        document.getElementById('edit-profile-modal').classList.add('hidden');
        await refreshBalanceAndProfile();
        renderProfile(document.getElementById('app-view'));
      } catch (err) {
        notify(err.message, true);
      } finally {
        state.isSavingProfile = false;
        btn.disabled = false;
        spinner.classList.add('hidden');
        btnText.innerText = i18n[state.lang].save_changes;
      }
    });

    // SUPPORT TOGGLER
    const supportFolder = document.getElementById('support-folder');
    document.getElementById('btn-support-trigger')?.addEventListener('click', () => {
      supportFolder.classList.toggle('hidden');
    });
    document.getElementById('btn-close-support')?.addEventListener('click', () => {
      supportFolder.classList.add('hidden');
    });

    // AUTH MODAL
    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
    }

    async function handleAuthSubmission() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const fullName = document.getElementById('auth-name')?.value.trim();
      const phone = document.getElementById('auth-phone')?.value.trim();

      if (!email || !password) return notify("ইমেইল ও পাসওয়ার্ড প্রদান করুন", true);

      const btn = document.getElementById('btn-auth-submit');
      const spinner = document.getElementById('btn-auth-spinner');
      btn.disabled = true;
      spinner.classList.remove('hidden');

      try {
        if (state.authMode === 'login') {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          state.user = data.user;
          notify("লগইন সফল হয়েছে");
        } else {
          if (!fullName || !phone) throw new Error("সম্পূর্ণ নাম ও মোবাইল নম্বর দেওয়া আবশ্যক");

          const { data, error } = await supabase.auth.signUp({ 
            email, 
            password,
            options: { data: { full_name: fullName, phone: phone } }
          });
          if (error) throw error;

          if (data.session) {
            state.user = data.user;
          } else {
            const { data: logData, error: logErr } = await supabase.auth.signInWithPassword({ email, password });
            if (!logErr) state.user = logData.user;
          }

          notify("অ্যাকাউন্ট তৈরি ও লগইন সফল হয়েছে!");
        }

        document.getElementById('auth-modal').classList.add('hidden');
        await refreshBalanceAndProfile();
        navigate(state.activeTab);
      } catch (err) {
        notify(err.message, true);
      } finally {
        btn.disabled = false;
        spinner.classList.add('hidden');
      }
    }

    async function checkPaymentReturnVerification() {
      const params = new URLSearchParams(window.location.search);
      const isPaymentSuccess = params.get('payment') === 'success';
      const isPaymentCancelled = params.get('payment') === 'cancelled';
      const amount = params.get('amount');

      if (isPaymentSuccess) {
        notify(`পেমেন্ট সফল!${amount ? ' ৳' + amount : ''} ওয়ালেটে যুক্ত হয়েছে।`, false);
        window.history.replaceState({}, document.title, window.location.pathname);
        await refreshBalanceAndProfile();
      } else if (isPaymentCancelled) {
        notify("পেমেন্ট বাতিল করা হয়েছে।", true);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    document.getElementById('btn-close-auth')?.addEventListener('click', () => document.getElementById('auth-modal').classList.add('hidden'));
    document.getElementById('btn-auth-submit')?.addEventListener('click', handleAuthSubmission);
    document.getElementById('btn-quick-deposit-top')?.addEventListener('click', () => navigate('wallet'));

    document.getElementById('tab-login')?.addEventListener('click', () => {
      state.authMode = 'login';
      document.getElementById('tab-login').className = "flex-1 py-1.5 rounded-lg bg-indigo-600 text-white font-bold transition-all";
      document.getElementById('tab-signup').className = "flex-1 py-1.5 rounded-lg text-slate-500 font-bold transition-all";
      document.getElementById('signup-extra-fields').classList.add('hidden');
      document.getElementById('btn-auth-text').innerText = i18n[state.lang].btn_login_submit;
    });

    document.getElementById('tab-signup')?.addEventListener('click', () => {
      state.authMode = 'signup';
      document.getElementById('tab-signup').className = "flex-1 py-1.5 rounded-lg bg-indigo-600 text-white font-bold transition-all";
      document.getElementById('tab-login').className = "flex-1 py-1.5 rounded-lg text-slate-500 font-bold transition-all";
      document.getElementById('signup-extra-fields').classList.remove('hidden');
      document.getElementById('btn-auth-text').innerText = i18n[state.lang].btn_signup_submit;
    });

    document.getElementById('nav-home')?.addEventListener('click', () => navigate('home'));
    document.getElementById('nav-store')?.addEventListener('click', () => navigate('store'));
    document.getElementById('nav-orders')?.addEventListener('click', () => navigate('orders'));
    document.getElementById('nav-wallet')?.addEventListener('click', () => navigate('wallet'));
    document.getElementById('nav-profile')?.addEventListener('click', () => navigate('profile'));

    async function boot() {
      applyTheme(state.theme);
      applyLanguage(state.lang);
      await loadGlobalSettings();

      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          state.user = session.user;
          await refreshBalanceAndProfile();
        }
      } catch (e) {
        console.error("Session restore error:", e);
      }

      await checkPaymentReturnVerification();
      navigate('home');

      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 500);
        }
      }, 600);
    }

    boot();
  </script>
</body>
</html>
